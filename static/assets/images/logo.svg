<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <linearGradient id="snrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="resGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="supGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- ICON EMBLEM -->
  <g transform="translate(15, 12)" filter="url(#softShadow)">
    <!-- Rounded Shield Background -->
    <rect x="0" y="0" width="96" height="96" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    
    <!-- Resistance Level Line (Red) -->
    <line x1="16" y1="28" x2="80" y2="28" stroke="url(#resGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 3"/>
    <text x="82" y="25" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="800" fill="#f43f5e">R</text>

    <!-- Golden Fibo Level Line (Cyan) -->
    <line x1="20" y1="48" x2="76" y2="48" stroke="#0ea5e9" stroke-width="1.8" stroke-linecap="round"/>
    <text x="78" y="46" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="700" fill="#0ea5e9">50%</text>

    <!-- Support Level Line (Green) -->
    <line x1="16" y1="68" x2="80" y2="68" stroke="url(#supGrad)" stroke-width="3" stroke-linecap="round"/>
    <text x="82" y="72" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="800" fill="#10b981">S</text>

    <!-- Rejection Candlestick on Support -->
    <!-- Wick -->
    <line x1="48" y1="36" x2="48" y2="74" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <!-- Body -->
    <rect x="42" y="42" width="12" height="18" rx="3" fill="url(#supGrad)"/>
    <!-- Dynamic Target Dot -->
    <circle cx="48" cy="34" r="3.5" fill="#0284c7"/>
  </g>

  <!-- BRAND TYPOGRAPHY -->
  <g transform="translate(130, 0)">
    <!-- "TRADING" in Deep Slate -->
    <text x="0" y="62" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="38" fill="#0f172a" letter-spacing="1">
      TRADING
    </text>

    <!-- "SNR" Badge / Gradient -->
    <g transform="translate(186, 26)">
      <rect x="0" y="0" width="112" height="42" rx="10" fill="url(#snrGrad)"/>
      <text x="56" y="30" font-family="'Inter', sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="2">
        SNR
      </text>
    </g>

    <!-- Tagline & Value Proposition -->
    <g transform="translate(2, 88)">
      <circle cx="4" cy="-4" r="3.5" fill="#10b981"/>
      <text x="16" y="0" font-family="'Inter', sans-serif" font-weight="700" font-size="11.5" fill="#64748b" letter-spacing="2">
        SISTEMA CUANTITATIVO DE ALTA CONFLUENCIA
      </text>
      <!-- "100% GRATUITO" Pill -->
      <g transform="translate(322, -12)">
        <rect x="0" y="0" width="82" height="18" rx="9" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
        <text x="41" y="12" font-family="'Inter', sans-serif" font-weight="800" font-size="9.5" fill="#059669" text-anchor="middle">
          100% GRATIS
        </text>
      </g>
    </g>
  </g>
</svg>
