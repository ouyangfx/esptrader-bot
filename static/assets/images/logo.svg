<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f59b"/>
      <stop offset="50%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#3a7bd5"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f59b"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>
    <linearGradient id="candleUp" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- LOGO EMBLEM / ICON -->
  <g transform="translate(15, 10)">
    <!-- Hexagonal Glow Base -->
    <path d="M 50 5 L 85 25 L 85 75 L 50 95 L 15 75 L 15 25 Z" fill="#0c192c" stroke="url(#primaryGrad)" stroke-width="2.5" opacity="0.9"/>
    
    <!-- Candlestick 1 (Left - Small) -->
    <line x1="33" y1="36" x2="33" y2="70" stroke="#00d2ff" stroke-width="2" opacity="0.6"/>
    <rect x="29" y="44" width="8" height="18" rx="2" fill="#00d2ff" opacity="0.75"/>

    <!-- Candlestick 2 (Middle - Medium) -->
    <line x1="50" y1="24" x2="50" y2="76" stroke="#00f59b" stroke-width="2.5"/>
    <rect x="45" y="32" width="10" height="30" rx="2" fill="url(#primaryGrad)"/>

    <!-- Candlestick 3 (Right - High Growth) -->
    <line x1="67" y1="14" x2="67" y2="64" stroke="#00f59b" stroke-width="2"/>
    <rect x="63" y="20" width="8" height="32" rx="2" fill="#00f59b" filter="url(#glow)"/>

    <!-- Dynamic Uptrend Arrow -->
    <path d="M 26 62 Q 48 50, 72 20" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <polygon points="76,16 64,21 72,27" fill="#ffffff"/>
    
    <!-- Pulse dot -->
    <circle cx="76" cy="16" r="3.5" fill="#00f59b" filter="url(#glow)"/>
  </g>

  <!-- TYPOGRAPHY -->
  <!-- "TRADER" -->
  <text x="130" y="65" font-family="'Inter', 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="40" fill="#ffffff" letter-spacing="1.5">
    TRADER
  </text>

  <!-- Number "4" Badge -->
  <g transform="translate(305, 27)">
    <rect x="0" y="0" width="38" height="42" rx="9" fill="url(#primaryGrad)" filter="url(#glow)"/>
    <text x="19" y="32" font-family="'Inter', 'Montserrat', sans-serif" font-weight="900" font-size="34" fill="#060d17" text-anchor="middle">
      4
    </text>
  </g>

  <!-- "LESS" -->
  <text x="355" y="65" font-family="'Inter', 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="40" fill="url(#accentGrad)" letter-spacing="1.5" filter="url(#softGlow)">
    LESS
  </text>

  <!-- Domain ".com" badge -->
  <rect x="466" y="38" width="46" height="20" rx="5" fill="#13273e" stroke="#00d2ff" stroke-width="1.2"/>
  <text x="489" y="52" font-family="'Inter', monospace, sans-serif" font-weight="700" font-size="11" fill="#00d2ff" text-anchor="middle" letter-spacing="0.8">
    .COM
  </text>

  <!-- Subtitle: ACADEMIA DE FOREX & OPCIONES BINARIAS -->
  <g transform="translate(132, 90)">
    <circle cx="4" cy="-4" r="3" fill="#00f59b"/>
    <text x="14" y="0" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="11.5" fill="#88a1be" letter-spacing="2.8">
      ACADEMIA DE FOREX &amp; OPCIONES BINARIAS
    </text>
  </g>
</svg>
