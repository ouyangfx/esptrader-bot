<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading SNR - Widget En Vivo</title>
  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- TradingView Lightweight Charts -->
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    :root {
      --bg-page: #070b14;
      --bg-wrap: #0b1329;
      --bg-chart: #0e1626;
      --border-color: rgba(255, 255, 255, 0.08);
      --iq-green: #00e676;
      --iq-red: #ff3d60;
      --iq-cyan: #00d2ff;
      --iq-gold: #ffd700;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg-page);
      color: #f8fafc;
      overflow-x: hidden;
      padding: 10px;
    }

    .widget-wrap {
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
      background: var(--bg-wrap);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.4);
    }

    /* WIDGET HEADER */
    .widget-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
      flex-wrap: wrap;
      gap: 10px;
    }
    .widget-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .widget-brand img {
      height: 32px;
    }
    .free-badge {
      background: rgba(0, 230, 118, 0.12);
      color: var(--iq-green);
      border: 1px solid rgba(0, 230, 118, 0.3);
      padding: 3px 8px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    /* HERO SIGNAL CARD IN WIDGET */
    .signal-card {
      background: #080d19;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      transition: all 0.3s;
    }
    .signal-card.card-call {
      background: rgba(0, 230, 118, 0.08);
      border-color: rgba(0, 230, 118, 0.35);
    }
    .signal-card.card-put {
      background: rgba(255, 61, 96, 0.08);
      border-color: rgba(255, 61, 96, 0.35);
    }
    .signal-card.card-waiting {
      background: rgba(0, 210, 255, 0.06);
      border-color: rgba(0, 210, 255, 0.25);
    }

    .sig-main-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .sig-badge {
      padding: 6px 14px;
      border-radius: 8px;
      font-weight: 900;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .sig-badge.badge-call { background: var(--iq-green); color: #06090f; }
    .sig-badge.badge-put { background: var(--iq-red); color: #ffffff; }
    .sig-badge.badge-waiting { background: var(--iq-cyan); color: #06090f; }

    .sig-pair-title {
      font-size: 1.2rem;
      font-weight: 900;
      font-family: 'JetBrains Mono', monospace;
      color: #ffffff;
    }
    .sig-state-msg {
      font-size: 0.82rem;
      font-weight: 600;
      color: #94a3b8;
    }

    .sig-fibo-levels {
      display: flex;
      gap: 8px;
    }
    .fibo-box {
      background: #0e1626;
      border: 1px solid var(--border-color);
      padding: 5px 10px;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
    }
    .fibo-box span { font-weight: 800; color: var(--iq-cyan); }

    .sig-entries-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .entry-pill {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      background: #0e1626;
      border: 1px solid var(--border-color);
      color: #94a3b8;
    }
    .entry-pill-e1 { border-color: rgba(0, 210, 255, 0.4); color: var(--iq-cyan); }
    .entry-pill-e2 { border-color: rgba(255, 215, 0, 0.4); color: var(--iq-gold); }

    /* PAIR SELECTOR PILLS */
    .pairs-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }
    .pill-btn {
      background: #0e1626;
      border: 1px solid var(--border-color);
      color: #8092a7;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      cursor: pointer;
      transition: all 0.2s;
    }
    .pill-btn:hover { background: #162238; color: #ffffff; }
    .pill-btn.active {
      background: var(--iq-cyan);
      border-color: var(--iq-cyan);
      color: #06090f;
      font-weight: 800;
    }

    /* CHART WRAPPER */
    .chart-box {
      width: 100%;
      height: 480px;
      position: relative;
      background: var(--bg-chart);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
    }
    #tv-chart-container {
      width: 100%;
      height: 100%;
    }
    .chart-price-hud {
      position: absolute;
      top: 10px;
      right: 12px;
      z-index: 10;
      background: rgba(14, 22, 38, 0.9);
      backdrop-filter: blur(4px);
      border: 1px solid var(--border-color);
      padding: 4px 10px;
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 0.9rem;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot-live {
      width: 8px;
      height: 8px;
      background: var(--iq-green);
      border-radius: 50%;
      display: inline-block;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }

    .widget-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      font-size: 0.75rem;
      color: #64748b;
      flex-wrap: wrap;
      gap: 8px;
    }
    .widget-footer a {
      color: var(--iq-cyan);
      text-decoration: none;
      font-weight: 700;
    }
    .widget-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="widget-wrap">
    <!-- HEADER -->
    <div class="widget-header">
      <div class="widget-brand">
        <img src="/static/assets/images/logo_tradingsnr.svg" alt="Trading SNR">
        <span class="free-badge"><i class="fa-solid fa-gift"></i> SEÑALES 100% GRATIS</span>
      </div>
      <div>
        <span style="font-size: 0.78rem; font-weight: 700; color: #94a3b8;">
          <i class="fa-solid fa-clock"></i> M5 Intra-Bar • Una Señal a la Vez
        </span>
      </div>
    </div>

    <!-- HERO SIGNAL CARD -->
    <div class="signal-card card-waiting" id="sig-card">
      <div class="sig-main-info">
        <div class="sig-badge badge-waiting" id="sig-badge">
          <i class="fa-solid fa-crosshairs"></i> <span id="sig-action">ESPERANDO</span>
        </div>
        <div>
          <div class="sig-pair-title" id="sig-pair-title">EURUSD-OTC</div>
          <div class="sig-state-msg" id="sig-state-msg">Escaneando 8 pares en simultáneo...</div>
        </div>
      </div>

      <div class="sig-fibo-levels">
        <div class="fibo-box">Límite 1: <span id="sig-f50">--</span></div>
        <div class="fibo-box">Límite 2: <span id="sig-f618">--</span></div>
      </div>

      <div class="sig-entries-row">
        <span class="entry-pill entry-pill-e1" id="embed-e1">E1 Apertura: --</span>
        <span class="entry-pill entry-pill-e2" id="embed-e2">E2 Retroceso: --</span>
      </div>
    </div>

    <!-- PAIRS SWITCHER -->
    <div class="pairs-bar">
      <button class="pill-btn active" data-pair="EURUSD-OTC" onclick="switchChartPair('EURUSD-OTC')">EURUSD-OTC</button>
      <button class="pill-btn" data-pair="GBPUSD-OTC" onclick="switchChartPair('GBPUSD-OTC')">GBPUSD-OTC</button>
      <button class="pill-btn" data-pair="USDJPY-OTC" onclick="switchChartPair('USDJPY-OTC')">USDJPY-OTC</button>
      <button class="pill-btn" data-pair="EURJPY-OTC" onclick="switchChartPair('EURJPY-OTC')">EURJPY-OTC</button>
      <button class="pill-btn" data-pair="EURUSD" onclick="switchChartPair('EURUSD')">EURUSD</button>
      <button class="pill-btn" data-pair="GBPUSD" onclick="switchChartPair('GBPUSD')">GBPUSD</button>
      <button class="pill-btn" data-pair="USDJPY" onclick="switchChartPair('USDJPY')">USDJPY</button>
      <button class="pill-btn" data-pair="EURJPY" onclick="switchChartPair('EURJPY')">EURJPY</button>
    </div>

    <!-- CHART CONTAINER (IQ OPTION OSCURO #0e1626) -->
    <div class="chart-box">
      <div id="tv-chart-container"></div>
      <div class="chart-price-hud">
        <span class="dot-live"></span>
        <span id="chart-live-price">0.00000</span>
      </div>
    </div>

    <!-- WIDGET FOOTER -->
    <div class="widget-footer">
      <div>
        <span>Desarrollado por <strong>Trading SNR</strong> • Análisis M5</span>
      </div>
      <div>
        <a href="https://t.me/traderfxapp" target="_blank"><i class="fa-brands fa-telegram"></i> Canal VIP Telegram</a>
      </div>
    </div>
  </div>

  <script>
    let tvChart = null;
    let candleSeries = null;
    let currentChartPair = 'EURUSD-OTC';
    let currentCandles = [];
    let fiboLine50 = null;
    let fiboLine618 = null;

    document.addEventListener('DOMContentLoaded', () => {
      initChart();
      fetchLive();
      setInterval(fetchLive, 2500);
      connectSignalsWS();
    });

    // Inicializar Gráfico estilo IQ Option
    function initChart() {
      const container = document.getElementById('tv-chart-container');
      if (!container || typeof LightweightCharts === 'undefined') return;

      tvChart = LightweightCharts.createChart(container, {
        width: container.clientWidth,
        height: 480,
        layout: {
          background: { type: 'solid', color: '#0e1626' }, // IQ Option dark
          textColor: '#8092a7',
          fontFamily: "'JetBrains Mono', monospace",
          fontSize: 11
        },
        grid: {
          vertLines: { color: 'rgba(255, 255, 255, 0.04)' },
          horzLines: { color: 'rgba(255, 255, 255, 0.04)' }
        },
        crosshair: {
          mode: LightweightCharts.CrosshairMode.Normal,
          vertLine: { color: 'rgba(0, 210, 255, 0.35)', width: 1, style: 2 },
          horzLine: { color: 'rgba(0, 210, 255, 0.35)', width: 1, style: 2 }
        },
        rightPriceScale: {
          borderColor: 'rgba(255, 255, 255, 0.08)',
          scaleMargins: { top: 0.12, bottom: 0.12 }
        },
        timeScale: {
          borderColor: 'rgba(255, 255, 255, 0.08)',
          timeVisible: true,
          secondsVisible: false,
          rightOffset: 6
        }
      });

      candleSeries = tvChart.addCandlestickSeries({
        upColor: '#00e676',
        downColor: '#ff3d60',
        borderUpColor: '#00e676',
        borderDownColor: '#ff3d60',
        wickUpColor: '#00e676',
        wickDownColor: '#ff3d60',
        priceLineVisible: true,
        lastValueVisible: true,
        priceLineWidth: 1,
        priceLineColor: '#00d2ff',
        priceLineStyle: LightweightCharts.LineStyle.Dashed
      });

      window.addEventListener('resize', () => {
        if (tvChart && container) {
          tvChart.applyOptions({ width: container.clientWidth });
        }
      });

      loadCandles(currentChartPair);
    }

    window.switchChartPair = function(pair) {
      currentChartPair = pair;
      document.querySelectorAll('.pill-btn').forEach(b => {
        if (b.getAttribute('data-pair') === pair) b.classList.add('active');
        else b.classList.remove('active');
      });
      loadCandles(pair);
    };

    async function loadCandles(pair, isSilent = false) {
      try {
        const resp = await fetch(`/api/candles?pair=${encodeURIComponent(pair)}&timeframe=300&count=180`);
        const data = await resp.json();
        if (data && data.candles && data.candles.length > 0) {
          currentCandles = data.candles;
          candleSeries.setData(currentCandles);
          if (data.markers && data.markers.length > 0) candleSeries.setMarkers(data.markers);
          else candleSeries.setMarkers([]);

          const dec = pair.includes('JPY') ? 3 : 5;
          const last = currentCandles[currentCandles.length - 1];
          const curP = data.current_tick || last.close;
          document.getElementById('chart-live-price').textContent = parseFloat(curP).toFixed(dec);

          if (!isSilent) tvChart.timeScale().fitContent();
          updateFiboLines(data.fibo);
        }
      } catch (e) {
        console.error("Error cargando velas:", e);
      }
    }

    function updateFiboLines(fibo) {
      if (fiboLine50 && candleSeries) { candleSeries.removePriceLine(fiboLine50); fiboLine50 = null; }
      if (fiboLine618 && candleSeries) { candleSeries.removePriceLine(fiboLine618); fiboLine618 = null; }

      if (fibo && fibo.fibo_50 && fibo.fibo_618) {
        const p50 = parseFloat(fibo.fibo_50);
        const p618 = parseFloat(fibo.fibo_618);
        fiboLine50 = candleSeries.createPriceLine({
          price: p50,
          color: '#00d2ff',
          lineWidth: 2,
          lineStyle: LightweightCharts.LineStyle.Dashed,
          axisLabelVisible: true,
          title: 'Límite 1'
        });
        fiboLine618 = candleSeries.createPriceLine({
          price: p618,
          color: '#ffd700',
          lineWidth: 2,
          lineStyle: LightweightCharts.LineStyle.Solid,
          axisLabelVisible: true,
          title: 'Límite 2'
        });
      }
    }

    function connectSignalsWS() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(`${protocol}//${window.location.host}/ws`);
      ws.onmessage = (event) => {
        try {
          if (typeof event.data === 'string' && event.data.startsWith('{')) {
            const data = JSON.parse(event.data);
            handleData(data);
          }
        } catch (e) {}
      };
      ws.onclose = () => { setTimeout(connectSignalsWS, 2000); };
    }

    async function fetchLive() {
      try {
        const resp = await fetch('/api/signals/live');
        if (resp.ok) {
          const data = await resp.json();
          handleData(data);
        }
      } catch (e) {}
    }

    function handleData(data) {
      if (data.type === 'tick') {
        let chartPrice = null;
        if (data.prices && data.prices[currentChartPair] !== undefined) {
          chartPrice = parseFloat(data.prices[currentChartPair]);
        } else if (data.pair === currentChartPair && data.tick_price > 0) {
          chartPrice = parseFloat(data.tick_price);
        }

        if (chartPrice && chartPrice > 0 && currentCandles && currentCandles.length > 0 && candleSeries) {
          const dec = currentChartPair.includes('JPY') ? 3 : 5;
          const livePriceEl = document.getElementById('chart-live-price');
          if (livePriceEl) livePriceEl.textContent = chartPrice.toFixed(dec);

          const serverTs = data.ts || (Date.now() / 1000);
          const currentCandleTime = Math.floor(serverTs / 300) * 300;
          const last = currentCandles[currentCandles.length - 1];

          if (last) {
            if (last.time === currentCandleTime) {
              last.close = chartPrice;
              if (chartPrice > last.high) last.high = chartPrice;
              if (chartPrice < last.low) last.low = chartPrice;
              candleSeries.update(last);
            } else if (currentCandleTime > last.time) {
              const newCandle = {
                time: currentCandleTime,
                open: chartPrice,
                high: chartPrice,
                low: chartPrice,
                close: chartPrice
              };
              currentCandles.push(newCandle);
              candleSeries.update(newCandle);
            }
          }
        }
        return;
      }

      // Signal card update
      const mode = data.engine_mode || data.state;
      let ev = data.pending_signal || data.current_trade || data.last_signal_event;
      if (!ev && data.live_signals_feed && data.live_signals_feed.length > 0) {
        ev = data.live_signals_feed[data.live_signals_feed.length - 1];
      }

      const card = document.getElementById('sig-card');
      const badge = document.getElementById('sig-badge');
      const action = document.getElementById('sig-action');
      const pairTitle = document.getElementById('sig-pair-title');
      const stateMsg = document.getElementById('sig-state-msg');
      const f50 = document.getElementById('sig-f50');
      const f618 = document.getElementById('sig-f618');

      if (ev) {
        const pair = ev.pair || 'EURUSD-OTC';
        const dir = ev.direction || 'CALL';
        const dec = pair.includes('JPY') ? 3 : 5;

        pairTitle.textContent = pair;
        if (dir === 'CALL') {
          card.className = 'signal-card card-call';
          badge.className = 'sig-badge badge-call';
          action.innerHTML = '<i class="fa-solid fa-arrow-trend-up"></i> COMPRA';
        } else {
          card.className = 'signal-card card-put';
          badge.className = 'sig-badge badge-put';
          action.innerHTML = '<i class="fa-solid fa-arrow-trend-down"></i> VENTA';
        }

        const zName = dir === 'CALL' ? 'Zona de Compras' : 'Zona de Ventas';
        if (mode === 'WAITING_PULLBACK' || mode === 'CONFIRMING') {
          stateMsg.textContent = `⚡ Señal confirmada • Esperando retroceso a la ${zName}`;
        } else if (mode === 'IN_TRADE') {
          stateMsg.textContent = `🎯 Operación activa (M5) • Expira en término de vela`;
        } else {
          stateMsg.textContent = `Última señal emitida a Telegram`;
        }

        f50.textContent = ev.fibo_50 ? parseFloat(ev.fibo_50).toFixed(dec) : '--';
        f618.textContent = ev.fibo_618 ? parseFloat(ev.fibo_618).toFixed(dec) : '--';

        // Desglose de las 2 entradas en el widget
        const em1 = document.getElementById('embed-e1');
        const em2 = document.getElementById('embed-e2');
        if (em1) {
          if (ev.entry_1 && ev.entry_1.price) {
            const r1 = ev.entry_1.result ? ` (${ev.entry_1.result})` : '';
            em1.textContent = `1️⃣ E1 Apertura: ${parseFloat(ev.entry_1.price).toFixed(dec)}${r1}`;
          } else if (ev.entry_price) {
            em1.textContent = `1️⃣ E1 Apertura: ${parseFloat(ev.entry_price).toFixed(dec)}`;
          }
        }
        if (em2) {
          if (ev.entry_2 && ev.entry_2.price) {
            const r2 = ev.entry_2.result ? ` (${ev.entry_2.result})` : '';
            em2.textContent = `2️⃣ E2 Retroceso: ${parseFloat(ev.entry_2.price).toFixed(dec)}${r2}`;
          } else if (ev.type === 'RESULTADO_DUAL' || ev.type === 'RESULTADO') {
            em2.textContent = '2️⃣ E2 Retroceso: No activada';
          } else if (ev.pullback_waiting || (data.current_trade && data.current_trade.pullback_waiting)) {
            em2.textContent = '2️⃣ E2 Retroceso: Esperando Zona';
          } else {
            em2.textContent = '2️⃣ E2 Retroceso: --';
          }
        }

        if (pair !== currentChartPair && (mode === 'WAITING_PULLBACK' || mode === 'IN_TRADE')) {
          switchChartPair(pair);
        }
      }
    }
  </script>
</body>
</html>
